<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give Feedback - Student Hub Portal</title>
</head>
<body style="background-color: rgb(208, 150, 250);">

    <!-- Header -->
    <header>
        <h1>Student Hub Portal</h1>
        <h2>Feedback Form</h2>
        <hr>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="home.html">Home</a> |
        <a href="explore.html">Explore</a> |
        <a href="events.html">Events</a> |
        <a href="materials.html">Study Materials</a> |
        <a href="profile.html">My Profile</a>
    </nav>

    <hr>

    <!-- Feedback Form -->
    <main>

        <h2>Share Your Feedback</h2>

        <form>

            

            <label>Feedback Type:</label><br>
            <select>
                <option>Suggestion</option>
                <option>Complaint</option>
                <option>Appreciation</option>
                <option>Bug Report</option>
            </select><br><br>

            <label>Rate Your Experience:</label><br>

            <input type="radio" name="rating"> Excellent
            <input type="radio" name="rating"> Good
            <input type="radio" name="rating"> Average
            <input type="radio" name="rating"> Poor

            <br><br>

            <label>Your Feedback:</label><br>
            <textarea rows="6" cols="50" placeholder="Write your feedback here..."></textarea>

            <br><br>

            <input type="submit" value="Submit Feedback">

        </form>

    </main>

    <hr>

    

</body>
</html>
